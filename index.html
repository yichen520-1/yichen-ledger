<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <!--
      CSP：Electron 会警告没有策略的页面。
      不用 unsafe-eval；style 放开 inline 是因为 React/AntD 式的行内样式和 vite 注入的样式需要它。
      connect-src 必须放开 https：忆小尘和图片识别要直连用户自己填的模型服务
      （api.deepseek.com / api.openai.com / 自建网关），写死 'self' 会让这些请求
      在浏览器里被拦成「Failed to fetch」，而用户完全看不出是策略问题。
      本机地址（Ollama 11434、LM Studio 1234 这类本地网关）也放开，
      它们只在这台机器上，不算对外暴露。
      ws: 只给 dev 时的 HMR 用，打包后不会建立连接。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://127.0.0.1:* http://localhost:* ws: wss:; object-src 'none'; base-uri 'none'"
    />
    <meta
      name="description"
      content="忆笺 — 记账、日程与忆小尘，本地优先，支持 Android / iOS / Windows / macOS"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- PWA：让手机能「添加到主屏幕」，之后全屏运行，和装 App 一样 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="忆笺" />
    <title>忆笺</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
