<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1216" />
    <!--
      CSP：Electron 会警告没有策略的页面。
      不用 unsafe-eval；style 放开 inline 是因为 React/AntD 式的行内样式和 vite 注入的样式需要它。
      connect-src 里的 ws: 只给 dev 时的 HMR 用，打包后不会建立连接。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'"
    />
    <meta
      name="description"
      content="忆尘记账 — 本地优先的个人记账应用，支持 Android / iOS / Windows / macOS"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <title>忆尘记账</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
