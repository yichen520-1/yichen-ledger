name: Build desktop and mobile installers

# 这台开发机是 Windows，做不出 macOS 的 dmg，也编译不了 iOS 的 ipa。
# GitHub Actions 恰好三个 runner 都有（windows / macos / ubuntu），
# 所以把「打安装包」这件事交给 CI：推一个 v* 的 tag 就自动出全套。
#
# 产物：
#   Windows  → NSIS 安装包 + 免安装 zip
#   macOS    → dmg（arm64 与 x64 各一个）
#   Linux    → AppImage
#   Android  → debug 签名的 apk（能直接装，适合自用）
#   iOS      → 未签名的 ipa（签名必须在本地用 Apple 账号做，见 README）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 跑单元测试
        run: npm test

      - name: 打包
        # NSIS 默认从 GitHub 拉工具链，国内网络不稳，换成镜像
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm run pack:win

      - name: 核对可执行文件名是英文、显示名是中文
        # 磁盘上必须是 yichen-ledger.exe（纯 ASCII，NSIS 才不会在
        # 非 ASCII 路径上翻车）；窗口标题/快捷方式名来自 productName
        # 与 nsis.shortcutName，都是总和名「忆笺」。
        shell: pwsh
        run: |
          $exe = 'release\win-unpacked\yichen-ledger.exe'
          if (-not (Test-Path $exe)) { throw "缺少 $exe" }
          $v = (Get-Item $exe).VersionInfo
          "文件名: $([System.IO.Path]::GetFileName($exe))"
          "FileDescription: $($v.FileDescription)"
          "ProductName:     $($v.ProductName)"
          "FileVersion:     $($v.FileVersion)"
          if ($v.FileDescription -ne '忆笺') { throw "FileDescription 不是中文显示名" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------ macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 dmg
        # 两个架构都出：Apple 芯片用 arm64，Intel 老机器用 x64。
        # 配置里 identity: null，跳过签名 —— 没有 Apple 开发者证书，
        # 用户第一次打开要在「系统设置 → 隐私与安全性」里点「仍要打开」。
        run: npm run pack:mac

      - name: 核对 .app 目录名是英文、显示名是中文
        # 这一条是给「程序名 ASCII / 显示名中文」这个约定留证据的：
        # 目录名必须落在 yichen-ledger.app，而 Info.plist 里的
        # CFBundleName / CFBundleDisplayName 必须是「忆笺」。
        # Finder、启动台、Dock、活动监视器显示的都是后两者。
        run: |
          for app in release/mac*/*.app; do
            echo "== $app"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist"
          done
          # 两个架构的 .app 目录名都必须是 ASCII 的 yichen-ledger.app，
          # 任何一个不是这里就会红，防止以后改配置改坏。
          test -d 'release/mac-arm64/yichen-ledger.app'
          test -d 'release/mac/yichen-ledger.app'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 AppImage
        run: npm run pack:linux

      - name: 核对可执行文件名是英文、桌面条目是中文
        # Linux 下「用户看到的名字」来自 .desktop 文件的 Name= 字段，
        # 而磁盘上的可执行文件与 AppImage 目录名走 executableName。
        # 这里把两边都打出来，保证「英文文件名 + 中文显示名」没走样。
        # --appimage-extract 不需要 FUSE，CI 容器里也能跑。
        run: |
          for img in release/*.AppImage; do
            echo "== $img"
            chmod +x "$img"
            "./$img" --appimage-extract >/dev/null 2>&1 || true
          done
          if [ -d squashfs-root ]; then
            echo "-- .desktop 里的 Name（用户看到的名字）"
            grep -h '^Name=' squashfs-root/*.desktop || echo "(没找到 .desktop)"
            echo "-- 磁盘上的可执行文件（应当是 ASCII）"
            find squashfs-root -maxdepth 1 -type f ! -name '*.desktop' ! -name '*.png' ! -name 'AppRun' -printf '%f\n' || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 7 的 Android 模板要求 JDK 21
          java-version: 21

      - name: 安装依赖
        run: npm ci

      - name: 构建 web 产物并同步进原生工程
        # cap sync 会把 dist/ 整个复制到 android/app/src/main/assets/public，
        # 所以必须先 build，否则它找不到 webDir 会直接报错
        run: npm run build && npx cap sync android

      - name: 编译 APK
        # debug 签名是 Capacitor 模板自带的那把 debug keystore，
        # 自己装着用没问题；要上架应用商店得换成正式签名。
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 核对包名、版本号与中文应用名
        # 安卓这边「用户看到的名字」是 launcher 上的 application-label，
        # 它来自 strings.xml 的 app_name（中文），跟磁盘上的文件名无关。
        # 顺手把 versionName 也验一遍，防止发版忘了升版本号。
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          echo "aapt: $AAPT"
          "$AAPT" dump badging "$apk" > /tmp/badging.txt
          head -1 /tmp/badging.txt
          want=$(node -p "require('./package.json').version")
          echo "package.json 版本: $want"
          grep -q "versionName='$want'" /tmp/badging.txt && echo "versionName OK" || { echo "versionName 对不上"; exit 1; }
          grep -q "application-label:'忆笺'" /tmp/badging.txt && echo "应用显示名 OK（中文）" || { echo "应用显示名不是中文"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # -------------------------------------------------------------------- iOS
  ios:
    # macOS runner 排队很看运气：实测有过「等了 15 分钟没排到、
    # 直接被 GitHub 取消」的情况（annotation: The job was not acquired by
    # Runner of type hosted even after multiple attempts）。
    # 加个超时，别让它一直挂着；真被取消就重新跑一次即可。
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 web 产物并同步进 Xcode 工程
        run: npm run build && npx cap sync ios

      - name: 装 CocoaPods 依赖
        run: cd ios/App && pod install --repo-update

      - name: 编译未签名 ipa
        # 没有 Apple 开发者证书，只能出「未签名」的包。
        # 拿到之后用 SideStore / Sideloadly 这类工具在本地重签才能装，
        # 或者把工程拖进 Xcode 用你自己的账号跑一次真机。
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/yichen-ledger-unsigned.ipa" Payload

      - name: 核对 .app 目录名是英文、桌面名是中文
        # 和 macOS 一样：磁盘上 App.app（纯 ASCII，Xcode 的 TARGET_NAME），
        # 主屏上显示的是 Info.plist 里的 CFBundleDisplayName「忆笺」。
        run: |
          app="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          test -d "$app" || { echo "找不到 $app"; exit 1; }
          echo "目录名: $(basename "$app")"
          echo -n "CFBundleDisplayName: "
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = "忆笺" \
            || { echo "显示名不是中文"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: yichen-ledger-unsigned.ipa
          if-no-files-found: error

  # --------------------------------------------------------------- 汇总发布
  release:
    # 只有打 tag 的时候才建 Release；手动触发就只留 artifact。
    # 用 always() 是为了：就算某个平台失败或被取消，也把已经出来的包发出去，
    # 不能因为一个平台拖累其他四个（尤其 macOS runner 经常排不上队）。
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      # 这个 job 只为了发版说明才需要仓库内容（docs/releases/<tag>.md）。
      # 用浅克隆就够了，只取一个提交。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # download-artifact 默认遇到「没有 artifact」会报错，
      # 这里在 release 分支里也让它不要因为个别平台缺失而整个失败
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist-artifacts

      - name: 把各平台产物摊平到一层
        run: |
          mkdir -p out
          find dist-artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.ipa' \) -exec cp {} out/ \;
          ls -lh out

      # 发版说明写在 docs/releases/<tag>.md 里，比塞进 YAML 好写、也好单独审阅。
      # 找不到对应文件时（比如临时打了个别的 tag）退回一段通用说明，不让发布卡住。
      - name: 准备发版说明
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            cp "$f" release-notes.md
            echo "用 $f 作为发版说明（$(wc -c < release-notes.md) 字节）"
          else
            echo "没找到 $f，改用通用说明"
            cat > release-notes.md <<'EOF'
          忆笺（本次未附详细说明，见仓库 README）

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows | `yichen-ledger-*-win-x64.exe` | 安装版，可选安装目录 |
          | Windows | `yichen-ledger-*-win-x64.zip` | 免安装，解压即用 |
          | macOS（Apple 芯片） | `yichen-ledger-*-mac-arm64.dmg` | M1 / M2 / M3 / M4 |
          | macOS（Intel） | `yichen-ledger-*-mac-x64.dmg` | 老款 Mac |
          | Linux | `yichen-ledger-*-linux-x86_64.AppImage` | `chmod +x` 后直接运行 |
          | Android | `app-debug.apk` | 浏览器下载后点安装 |
          | iOS | `yichen-ledger-unsigned.ipa` | **未签名**，需自行重签 |

          > 没有代码签名证书和 Apple 开发者账号：Windows 会提示「未知发布者」
          > （点「更多信息 → 仍要运行」），macOS 要在「系统设置 → 隐私与安全性」
          > 里点「仍要打开」，iOS 的 ipa 需用 SideStore / Sideloadly 重签。
          > 嫌麻烦就直接用网页版，功能完全一样。

          **网页版（免安装）**：<https://yichen520-1.github.io/yichen-ledger/>
          EOF
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          generate_release_notes: true
          body_path: release-notes.md
